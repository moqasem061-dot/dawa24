# =============================================================================
# Dawa24 Store - deployment compose (Elest.io reads this file)
# =============================================================================
#
# Three containers from ONE image, built once from the Dockerfile:
#
#   migrate  runs to completion, then exits      -> schema is current
#   server   HTTP, published on host 8070        -> depends on migrate succeeding
#   worker   River background jobs               -> depends on migrate succeeding
#
# Why a compose file and not just a Dockerfile: the Dockerfile says how to build
# the image; this says what to run. Without it, Elest.io generates a single
# "app" service that starts the server and never applies migrations - the server
# then boots, reports itself unready, and refuses traffic forever.
#
# Why migrations are their own container: N server replicas starting together
# would race to migrate, and a migration failure would surface as a crash loop
# instead of a failed step with a readable log. See docs/adr/decisions.md ADR 0004.
#
# Local development uses docker-compose.dev.yml instead (postgres/redis/minio).

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-prod}
  APP_NAME: Dawa24
  APP_BASE_URL: ${APP_BASE_URL}

  # Full connection URIs, set in the Elest.io environment panel. They are single
  # variables rather than host/port/password parts because the database and
  # Redis live on separate services with different hosts and non-default ports.
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}

  DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
  DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
  DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-30s}
  REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-10}

  # Where user uploads (licences, receipts, product images, import files, avatars)
  # are written. This MUST point inside the `uploads` named volume below - it is
  # the one directory whose contents have to outlive an image rebuild. Before
  # this was set the files lived only in the container's writable layer and
  # every `docker compose up --build` deploy discarded them.
  DATA_DIR: /app/data

  # Object storage. Not yet used by any code path; required only from Phase 5.
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
  STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-dawa24}
  STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
  STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
  STORAGE_USE_PATH_STYLE: ${STORAGE_USE_PATH_STYLE:-true}
  STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}

  SESSION_SECRET: ${SESSION_SECRET}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-dawa24_session}
  SESSION_TTL: ${SESSION_TTL:-720h}
  SESSION_SECURE: ${SESSION_SECURE:-true}

  # AI Gateway. Leave GATEWAY_ENABLED=false until a virtual key is issued -
  # every AI capability has a deterministic fallback, so this is a supported
  # configuration and not a degraded one.
  GATEWAY_ENABLED: ${GATEWAY_ENABLED:-false}
  GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:-https://api.muhiya.com}
  GATEWAY_VIRTUAL_KEY: ${GATEWAY_VIRTUAL_KEY:-}
  GATEWAY_CLIENT_APP: ${GATEWAY_CLIENT_APP:-dawa24-store}
  GATEWAY_TIMEOUT: ${GATEWAY_TIMEOUT:-60s}

  # SMTP Outbound Email (Password Reset, Email Verification, Notifications)
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-starttls}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@dawa24.net}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Dawa24 | دوا 24}
  SMTP_ENABLED: ${SMTP_ENABLED:-true}
  SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10s}

  # Google Maps Embed API. Optional; without a key the location picker renders a
  # coordinate-entry fallback (Google blocks framing maps.google.com without the
  # official Embed API). The key is browser-public - restrict it by HTTP
  # referrer in Google Cloud Console.
  GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}

  # Telegram bridge. Both or neither. TELEGRAM_BRIDGE_TOKEN is a random secret
  # shared with the n8n credential (openssl rand -hex 32) - NOT the BotFather
  # token, which belongs only in n8n's Telegram credential.
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  TELEGRAM_BRIDGE_TOKEN: ${TELEGRAM_BRIDGE_TOKEN:-}

  # WhatsApp bridge. Number and token both or neither. The token is a random
  # secret shared with the n8n credential - NOT the Meta access token, which
  # belongs only in n8n's WhatsApp credential.
  WHATSAPP_BUSINESS_NUMBER: ${WHATSAPP_BUSINESS_NUMBER:-}
  WHATSAPP_BRIDGE_TOKEN: ${WHATSAPP_BRIDGE_TOKEN:-}
  WHATSAPP_NOTIFICATION_TEMPLATE: ${WHATSAPP_NOTIFICATION_TEMPLATE:-}
  WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-ar}

  # Social-media digest for n8n (openssl rand -hex 32). Empty leaves it off.
  MARKETING_BRIDGE_TOKEN: ${MARKETING_BRIDGE_TOKEN:-}

  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: json
  TRACE_SAMPLING: ${TRACE_SAMPLING:-0.05}

x-build: &build
  build:
    context: .
    dockerfile: Dockerfile
    args:
      VERSION: ${VERSION:-dev}
      COMMIT: ${COMMIT:-unknown}
      # Embed cache metadata in the image so the next build's cache_from can
      # reuse its layers. Universally supported, unlike build.cache_to.
      BUILDKIT_INLINE_CACHE: "1"
    # Reuse layers from the previously built image. On a webhook deploy that
    # runs `docker compose build` this lets an unchanged dependency layer and a
    # warm Go build cache carry over from the last deploy instead of rebuilding
    # cold. A missing image on the first build is ignored.
    cache_from:
      - dawa24-store:local

services:
  migrate:
    <<: *build
    image: dawa24-store:local
    command: ["/app/cli", "migrate"]
    environment: *app-env
    restart: "no"
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  server:
    image: dawa24-store:local
    command: ["/app/server"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # Host 8070, not 8080: 8080 belongs to another project on this host.
      #
      # Published on the Docker bridge address only, which is the reverse
      # proxy's target (docs/DEPLOY_TEST.md: HTTP 172.17.0.1:8070). "8070:8070"
      # published on every interface, so the app answered on the VM's public IP
      # over plain HTTP, bypassing TLS and the proxy. SERVER_BIND_ADDR overrides
      # the address on a host whose bridge is not 172.17.0.1.
      - "${SERVER_BIND_ADDR:-172.17.0.1}:8070:8070"
    environment:
      <<: *app-env
      PORT: "8070"
      # Go's garbage collector sizes itself against the whole machine unless it
      # is told otherwise, and this container shares that machine with the
      # worker and (on a single-VM deployment) with PostgreSQL. Without a
      # limit, a large import in one process pushed the box into swap and every
      # OTHER request slowed down with it - which is why the slowness reports
      # were never confined to the person doing the uploading.
      #
      # Set to roughly 75% of the container's memory ceiling below, which is
      # what leaves the GC room to work before the kernel's OOM killer does it
      # for us.
      GOMEMLIMIT: ${SERVER_GOMEMLIMIT:-1500MiB}
      GOMAXPROCS: ${SERVER_GOMAXPROCS:-2}
    deploy:
      resources:
        limits:
          memory: ${SERVER_MEMORY_LIMIT:-2G}
          cpus: "${SERVER_CPU_LIMIT:-2}"
    healthcheck:
      # Liveness only - deliberately dependency-free, so a brief database blip
      # does not restart a healthy container and turn an outage into a crash
      # loop. Readiness (/ready) additionally checks dependencies and pending
      # migrations; that is what the reverse proxy should poll.
      test: ["CMD", "curl", "-fsS", "http://localhost:8070/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      # User uploads persist here, outside the image. DATA_DIR=/app/data (see
      # x-app-env) makes the app write to /app/data/uploads, which is this
      # volume. Rebuilding and recreating the container no longer wipes files.
      - uploads:/app/data
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  worker:
    image: dawa24-store:local
    command: ["/app/worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    volumes:
      # The worker also writes into the uploads tree (image-import and compare
      # jobs), so it mounts the same volume as the server.
      - uploads:/app/data
    environment:
      <<: *app-env
      WORKER_IMPORTS: ${WORKER_IMPORTS:-2}
      WORKER_AI: ${WORKER_AI:-4}
      WORKER_NOTIFICATIONS: ${WORKER_NOTIFICATIONS:-4}
      WORKER_PROJECTIONS: ${WORKER_PROJECTIONS:-2}
      WORKER_MAINTENANCE: ${WORKER_MAINTENANCE:-1}
      WORKER_SHUTDOWN_TIMEOUT: ${WORKER_SHUTDOWN_TIMEOUT:-60s}
      # The worker is CPU-bound: parsing a twenty-thousand-row workbook and
      # matching it against the catalogue is arithmetic, not waiting. Capping it
      # at one core is deliberate - it is what stops a bulk import from starving
      # the HTTP server of the CPU it needs to answer everyone else.
      GOMEMLIMIT: ${WORKER_GOMEMLIMIT:-1000MiB}
      GOMAXPROCS: ${WORKER_GOMAXPROCS:-1}
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-1500M}
          cpus: "${WORKER_CPU_LIMIT:-1}"
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

volumes:
  # Durable store for user uploads. A named volume lives on the host and is
  # untouched by `docker compose up --build`; only an explicit `docker volume
  # rm dawa24-store_uploads` removes it. Migrate off this onto S3/object
  # storage (STORAGE_* in x-app-env) when that code path lands.
  uploads:
