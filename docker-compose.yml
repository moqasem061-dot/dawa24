# =============================================================================
# Dawa24 Store - Production Docker Compose for Hostinger VPS (Docker Manager)
# =============================================================================
# Import this file directly into Hostinger Docker Manager:
#   https://github.com/moqasem061-dot/dawa24/blob/main/docker-compose.yml
# =============================================================================

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-prod}
  APP_NAME: ${APP_NAME:-Dawa24}
  APP_BASE_URL: ${APP_BASE_URL:-https://${APP_DOMAIN:-localhost}}
  PORT: "8070"

  # Internal container-to-container connections (zero public internet exposure)
  DATABASE_URL: postgres://dawa24_app:${DB_APP_PASSWORD:-dawa24_secret_app_pw}@postgres:5432/${POSTGRES_DB:-dawa24_store}?sslmode=disable
  REDIS_URL: redis://:${REDIS_PASSWORD:-dawa24_secret_redis_pw}@redis:6379/0

  DB_MAX_CONNS: ${DB_MAX_CONNS:-25}
  DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
  DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-30s}
  REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-15}

  DATA_DIR: /app/data

  SESSION_SECRET: ${SESSION_SECRET:-9f8b7c6d5e4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-dawa24_session}
  SESSION_TTL: ${SESSION_TTL:-720h}
  SESSION_SECURE: ${SESSION_SECURE:-true}

  GATEWAY_ENABLED: ${GATEWAY_ENABLED:-false}
  GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:-https://api.muhiya.com}
  GATEWAY_VIRTUAL_KEY: ${GATEWAY_VIRTUAL_KEY:-}
  GATEWAY_CLIENT_APP: ${GATEWAY_CLIENT_APP:-dawa24-store}
  GATEWAY_TIMEOUT: ${GATEWAY_TIMEOUT:-60s}

  GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}

  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: json
  TRACE_SAMPLING: ${TRACE_SAMPLING:-0.05}

x-build: &build
  build:
    context: .
    dockerfile: Dockerfile
    args:
      VERSION: ${VERSION:-prod}
      COMMIT: ${COMMIT:-unknown}
      BUILDKIT_INLINE_CACHE: "1"

services:
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@dawa24.net}
    volumes:
      - ./deploy/hostinger/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    networks:
      - default

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dawa24_store}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dawa24_secret_postgres_pw}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-dawa24_secret_app_pw}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/hostinger/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./deploy/tuning/postgresql-${VPS_PROFILE:-4gb}.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dawa24_store}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dawa24_secret_redis_pw}", "--maxmemory", "${REDIS_MAX_MEMORY:-512mb}", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dawa24_secret_redis_pw}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  migrate:
    <<: *build
    image: dawa24-store:local
    command: ["/app/cli", "migrate"]
    environment:
      <<: *app-env
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dawa24_secret_postgres_pw}@postgres:5432/${POSTGRES_DB:-dawa24_store}?sslmode=disable
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  server:
    <<: *build
    image: dawa24-store:local
    command: ["/app/server"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      GOMEMLIMIT: ${SERVER_GOMEMLIMIT:-1400MiB}
      GOMAXPROCS: ${SERVER_GOMAXPROCS:-2}
    deploy:
      resources:
        limits:
          memory: ${SERVER_MEMORY_LIMIT:-1800M}
          cpus: "2"
    volumes:
      - uploads:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8070/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default

  worker:
    <<: *build
    image: dawa24-store:local
    command: ["/app/worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      WORKER_IMPORTS: ${WORKER_IMPORTS:-2}
      WORKER_AI: ${WORKER_AI:-2}
      WORKER_NOTIFICATIONS: ${WORKER_NOTIFICATIONS:-4}
      WORKER_PROJECTIONS: ${WORKER_PROJECTIONS:-2}
      WORKER_MAINTENANCE: ${WORKER_MAINTENANCE:-1}
      GOMEMLIMIT: ${WORKER_GOMEMLIMIT:-700MiB}
      GOMAXPROCS: ${WORKER_GOMAXPROCS:-1}
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-900M}
          cpus: "1"
    volumes:
      - uploads:/app/data
    networks:
      - default

volumes:
  pgdata:
  redisdata:
  uploads:
  caddy_data:
  caddy_config:

networks:
  default:
    name: dawa24-net
