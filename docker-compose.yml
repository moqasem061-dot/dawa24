# =============================================================================
# Dawa24 Store - Production Docker Compose for Traefik Ingress (Hostinger / Elestio)
# =============================================================================
# Automatically connects to the existing PostgreSQL database on postgresql-psr0_default,
# seeds reference data, creates the Super Admin account, and routes HTTPS traffic 
# through Traefik with automated Let's Encrypt SSL.
# =============================================================================

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-prod}
        COMMIT: ${COMMIT:-unknown}
        BUILDKIT_INLINE_CACHE: "1"
    command: ["/app/cli", "migrate"]
    restart: "no"
    environment:
      - APP_ENV=${APP_ENV:-prod}
      # Migrations run as the schema owner, from MIGRATE_DATABASE_URL only.
      # The owner credential is never given to the server or worker.
      - DATABASE_URL=${MIGRATE_DATABASE_URL:?Set MIGRATE_DATABASE_URL to the schema-owner connection (see docs/SECURITY_DATABASE_AND_SECRETS.md)}
      # migrate sets the dawa24_app password from this (see cmd/cli/app_role.go).
      - DB_APP_PASSWORD=${DB_APP_PASSWORD:?Set DB_APP_PASSWORD (at least 24 random characters)}
      - DATA_DIR=/app/data
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@dawa24.net}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - ${DATA_VOLUME_PATH:-/var/${COMPOSE_PROJECT_NAME:-dawa24}/data}:/app/data
    networks:
      - postgresql-psr0_default

  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-prod}
        COMMIT: ${COMMIT:-unknown}
        BUILDKIT_INLINE_CACHE: "1"
    command: ["/app/server"]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-dawa24}.rule=${TRAEFIK_HOST_RULE:-Host(`${APP_DOMAIN:-dawa24.com}`) || Host(`srv1986270.hstgr.cloud`)}
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-dawa24}.entrypoints=web,websecure
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME:-dawa24}.tls.certresolver=letsencrypt
      - traefik.http.services.${TRAEFIK_ROUTER_NAME:-dawa24}.loadbalancer.server.port=8070
    ports:
      - "127.0.0.1::8070"
    environment:
      - APP_ENV=${APP_ENV:-prod}
      - APP_NAME=${APP_NAME:-Dawa24}
      - APP_BASE_URL=${APP_BASE_URL:-https://${APP_DOMAIN:-dawa24.com}}
      - PORT=8070
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # The server and worker connect as the least-privilege dawa24_app role only.
      # They refuse to start on a superuser, BYPASSRLS or table-owner connection
      # (DB_REQUIRE_RLS defaults to true in production).
      - DATABASE_URL=${APP_DATABASE_URL:?Set APP_DATABASE_URL to the dawa24_app connection, never the owner or a superuser}
      - DB_REQUIRE_RLS=${DB_REQUIRE_RLS:-true}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      - DB_MAX_CONNS=${DB_MAX_CONNS:-25}
      - DB_MIN_CONNS=${DB_MIN_CONNS:-2}
      - DB_STATEMENT_TIMEOUT=30s
      - DATA_DIR=/app/data
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET (64 hex characters)}
      - SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME:-dawa24_session}
      - SESSION_TTL=720h
      - SESSION_SECURE=true
      - GOMEMLIMIT=1400MiB
      - GOMAXPROCS=2
      - GATEWAY_ENABLED=${GATEWAY_ENABLED:-false}
      - GATEWAY_BASE_URL=${GATEWAY_BASE_URL:-https://api.dawa24.com}
      - GATEWAY_VIRTUAL_KEY=${GATEWAY_VIRTUAL_KEY:-}
      - GATEWAY_CLIENT_APP=dawa24-store
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=json
      - TRACE_SAMPLING=0.05
      - SMTP_HOST=${SMTP_HOST:-smtp.hostinger.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_ENCRYPTION=${SMTP_ENCRYPTION:-tls}
      - SMTP_USERNAME=${SMTP_USERNAME:-no-reply@dawa24.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-no-reply@dawa24.com}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Dawa24 | دوا 24}
      - SMTP_ENABLED=${SMTP_ENABLED:-true}
      - SMTP_TIMEOUT=${SMTP_TIMEOUT:-10s}
      - DEV_SHOW_MOCK_OTP=${DEV_SHOW_MOCK_OTP:-false}
      - TURNSTILE_ENABLED=${TURNSTILE_ENABLED:-true}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - CLARITY_PROJECT_ID=${CLARITY_PROJECT_ID:-ymd15b26tc}
      - AUTH_REQUIRE_EMAIL_VERIFICATION=${AUTH_REQUIRE_EMAIL_VERIFICATION:-false}
      - AUTH_REQUIRE_PHONE_VERIFICATION=${AUTH_REQUIRE_PHONE_VERIFICATION:-false}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BRIDGE_TOKEN=${TELEGRAM_BRIDGE_TOKEN:-}
      - TELEGRAM_GATEWAY_TOKEN=${TELEGRAM_GATEWAY_TOKEN:-}
      - WHATSAPP_BUSINESS_NUMBER=${WHATSAPP_BUSINESS_NUMBER:-}
      - WHATSAPP_BRIDGE_TOKEN=${WHATSAPP_BRIDGE_TOKEN:-}
      - WHATSAPP_NOTIFICATION_TEMPLATE=${WHATSAPP_NOTIFICATION_TEMPLATE:-}
      - WHATSAPP_TEMPLATE_LANGUAGE=${WHATSAPP_TEMPLATE_LANGUAGE:-ar}
      - MARKETING_BRIDGE_TOKEN=${MARKETING_BRIDGE_TOKEN:-}
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT:-}
      - STORAGE_REGION=${STORAGE_REGION:-us-east-1}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-dawa24}
      - STORAGE_ACCESS_KEY_ID=${STORAGE_ACCESS_KEY_ID:-}
      - STORAGE_SECRET_ACCESS_KEY=${STORAGE_SECRET_ACCESS_KEY:-}
      - STORAGE_USE_PATH_STYLE=${STORAGE_USE_PATH_STYLE:-true}
      - STORAGE_PUBLIC_BASE_URL=${STORAGE_PUBLIC_BASE_URL:-}
    volumes:
      - ${DATA_VOLUME_PATH:-/var/${COMPOSE_PROJECT_NAME:-dawa24}/data}:/app/data
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - default
      - postgresql-psr0_default
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-prod}
        COMMIT: ${COMMIT:-unknown}
        BUILDKIT_INLINE_CACHE: "1"
    command: ["/app/worker"]
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - APP_ENV=${APP_ENV:-prod}
      - APP_NAME=${APP_NAME:-Dawa24}
      - APP_BASE_URL=${APP_BASE_URL:-https://${APP_DOMAIN:-dawa24.com}}
      - PORT=8070
      # The server and worker connect as the least-privilege dawa24_app role only.
      # They refuse to start on a superuser, BYPASSRLS or table-owner connection
      # (DB_REQUIRE_RLS defaults to true in production).
      - DATABASE_URL=${APP_DATABASE_URL:?Set APP_DATABASE_URL to the dawa24_app connection, never the owner or a superuser}
      - DB_REQUIRE_RLS=${DB_REQUIRE_RLS:-true}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      - DB_MAX_CONNS=${DB_MAX_CONNS:-25}
      - DB_MIN_CONNS=${DB_MIN_CONNS:-2}
      - DB_STATEMENT_TIMEOUT=30s
      - DATA_DIR=/app/data
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET (64 hex characters)}
      - GOMEMLIMIT=700MiB
      - GOMAXPROCS=1
      - WORKER_IMPORTS=2
      - WORKER_AI=2
      - WORKER_NOTIFICATIONS=4
      - WORKER_PROJECTIONS=2
      - WORKER_MAINTENANCE=1
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=json
      - SMTP_HOST=${SMTP_HOST:-smtp.hostinger.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_ENCRYPTION=${SMTP_ENCRYPTION:-tls}
      - SMTP_USERNAME=${SMTP_USERNAME:-no-reply@dawa24.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-no-reply@dawa24.com}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Dawa24 | دوا 24}
      - SMTP_ENABLED=${SMTP_ENABLED:-true}
      - SMTP_TIMEOUT=${SMTP_TIMEOUT:-10s}
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT:-}
      - STORAGE_REGION=${STORAGE_REGION:-us-east-1}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-dawa24}
      - STORAGE_ACCESS_KEY_ID=${STORAGE_ACCESS_KEY_ID:-}
      - STORAGE_SECRET_ACCESS_KEY=${STORAGE_SECRET_ACCESS_KEY:-}
      - STORAGE_USE_PATH_STYLE=${STORAGE_USE_PATH_STYLE:-true}
      - STORAGE_PUBLIC_BASE_URL=${STORAGE_PUBLIC_BASE_URL:-}
    volumes:
      - ${DATA_VOLUME_PATH:-/var/${COMPOSE_PROJECT_NAME:-dawa24}/data}:/app/data
    networks:
      - default
      - postgresql-psr0_default
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - default

networks:
  default:
  postgresql-psr0_default:
    external: true

volumes:
  redis-data:
