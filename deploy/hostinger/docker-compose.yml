# =============================================================================
# Dawa24 - Standalone Hostinger KVM VPS Compose Stack
# =============================================================================
# Self-contained 6-service production stack:
#   caddy     -> Edge reverse proxy on 80/443 with automated Let's Encrypt SSL
#   server    -> Go Monolith web application (internal port 8070)
#   worker    -> River background job processor
#   migrate   -> Schema migration runner (runs once on deploy, then exits)
#   postgres  -> PostgreSQL 18 with tuned NVMe buffers & NOBYPASSRLS security
#   redis     -> Redis 7 with LRU memory eviction
# =============================================================================

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-prod}
  APP_NAME: Dawa24
  APP_BASE_URL: https://${APP_DOMAIN}
  PORT: "8070"

  # Internal container-to-container connections (zero public internet exposure)
  DATABASE_URL: postgres://dawa24_app:${DB_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-dawa24_store}?sslmode=disable
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

  DB_MAX_CONNS: ${DB_MAX_CONNS:-25}
  DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
  DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-30s}
  REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-15}

  DATA_DIR: /app/data

  SESSION_SECRET: ${SESSION_SECRET}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-dawa24_session}
  SESSION_TTL: ${SESSION_TTL:-720h}
  SESSION_SECURE: ${SESSION_SECURE:-true}

  GATEWAY_ENABLED: ${GATEWAY_ENABLED:-false}
  GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:-https://api.dawa24.com}
  GATEWAY_VIRTUAL_KEY: ${GATEWAY_VIRTUAL_KEY:-}
  GATEWAY_CLIENT_APP: ${GATEWAY_CLIENT_APP:-dawa24-store}
  GATEWAY_TIMEOUT: ${GATEWAY_TIMEOUT:-60s}

  # SMTP Outbound Email (Password Reset, Email Verification, Notifications)
  SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
  SMTP_PORT: ${SMTP_PORT:-465}
  SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
  SMTP_USERNAME: ${SMTP_USERNAME:-no-reply@dawa24.com}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@dawa24.com}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Dawa24 | دوا 24}
  SMTP_ENABLED: ${SMTP_ENABLED:-true}
  SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10s}

  # Cloudflare Turnstile
  TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-true}
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}

  # Auth & Registration Verification Requirements
  AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-false}
  AUTH_REQUIRE_PHONE_VERIFICATION: ${AUTH_REQUIRE_PHONE_VERIFICATION:-false}

  GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}

  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: json
  TRACE_SAMPLING: ${TRACE_SAMPLING:-0.05}

  # Telegram bridge (Capsule + notifications via n8n)
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BRIDGE_TOKEN: ${TELEGRAM_BRIDGE_TOKEN:-}
  TELEGRAM_GATEWAY_TOKEN: ${TELEGRAM_GATEWAY_TOKEN:-}

  # WhatsApp bridge (Capsule + notifications via n8n)
  WHATSAPP_BUSINESS_NUMBER: ${WHATSAPP_BUSINESS_NUMBER:-}
  WHATSAPP_BRIDGE_TOKEN: ${WHATSAPP_BRIDGE_TOKEN:-}
  WHATSAPP_NOTIFICATION_TEMPLATE: ${WHATSAPP_NOTIFICATION_TEMPLATE:-}
  WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-ar}

  # Marketing digest read by n8n
  MARKETING_BRIDGE_TOKEN: ${MARKETING_BRIDGE_TOKEN:-}

  # Master Catalog Import (0 = unlimited)
  CATALOG_MAX_IMPORT_ROWS: ${CATALOG_MAX_IMPORT_ROWS:-0}
  MAX_IMPORT_UPLOAD_MB: ${MAX_IMPORT_UPLOAD_MB:-200}

x-build: &build
  build:
    context: ../..
    dockerfile: Dockerfile
    args:
      VERSION: ${VERSION:-prod}
      COMMIT: ${COMMIT:-unknown}
      BUILDKIT_INLINE_CACHE: "1"

services:
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    networks:
      - default

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dawa24_store}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ../tuning/postgresql-${VPS_PROFILE:-4gb}.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dawa24_store}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "${REDIS_MAX_MEMORY:-512mb}", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  migrate:
    <<: *build
    image: dawa24:local
    command: ["/app/cli", "migrate"]
    environment:
      <<: *app-env
      # Migrations require superuser privileges to ensure schemas and grants exist
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dawa24_store}?sslmode=disable
      # migrate keeps dawa24_app's password in step with this value.
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      # Creates the first super_admin only; see .env.production.example.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  server:
    <<: *build
    image: dawa24:local
    command: ["/app/server"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      GOMEMLIMIT: ${SERVER_GOMEMLIMIT:-1400MiB}
      GOMAXPROCS: ${SERVER_GOMAXPROCS:-2}
    deploy:
      resources:
        limits:
          memory: ${SERVER_MEMORY_LIMIT:-1800M}
          cpus: "2"
    volumes:
      - uploads:/app/data
    dns:
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8070/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default

  worker:
    <<: *build
    image: dawa24:local
    command: ["/app/worker"]
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      WORKER_IMPORTS: ${WORKER_IMPORTS:-2}
      WORKER_AI: ${WORKER_AI:-2}
      WORKER_NOTIFICATIONS: ${WORKER_NOTIFICATIONS:-4}
      WORKER_PROJECTIONS: ${WORKER_PROJECTIONS:-2}
      WORKER_MAINTENANCE: ${WORKER_MAINTENANCE:-1}
      GOMEMLIMIT: ${WORKER_GOMEMLIMIT:-700MiB}
      GOMAXPROCS: ${WORKER_GOMAXPROCS:-1}
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-900M}
          cpus: "1"
    volumes:
      - uploads:/app/data
    networks:
      - default

volumes:
  pgdata:
  redisdata:
  uploads:
  caddy_data:
  caddy_config:

networks:
  default:
    name: dawa24-net
