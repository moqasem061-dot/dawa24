name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repository; the token needs nothing more.
permissions:
  contents: read

# One database and one cache per job; every step below reads these.
env:
  DATABASE_URL: postgres://dawa24:dawa24@localhost:5432/dawa24_store?sslmode=disable
  REDIS_URL: redis://localhost:6379/0
  SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

jobs:
  check:
    name: Quality Gates & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dawa24
          POSTGRES_PASSWORD: dawa24
          POSTGRES_DB: dawa24_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dawa24 -d dawa24_store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # check-alpine-csp runs a Node script.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # .golangci.yml is a v2 config; a v1 binary cannot parse it.
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.13.2

      - name: Run Migrations
        run: |
          go run ./cmd/cli migrate
          go run ./cmd/cli migrate-status

      # The suite runs once: race detector and coverage profile together.
      - name: Run Tests (race detector + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out -count=1 ./...

      # S11: the TenantIsolation tests skip when connected as a superuser, which
      # bypasses row-level security, so the run above proves nothing for them. This
      # step runs them again as the non-superuser application role dawa24_app, which
      # migration 222 creates (password set there; this database is throwaway).
      - name: Run tenant-isolation tests as the application role
        env:
          DATABASE_URL: postgres://dawa24_app:dawa24_app_change_me@localhost:5432/dawa24_store?sslmode=disable
        run: go test -count=1 -run TestTenantIsolation ./test/integration/

      - name: Enforce Coverage Floor
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          if awk "BEGIN{exit !(${total} < 1.0)}"; then
            echo "ERROR: total coverage is effectively zero (${total}%)."
            exit 1
          fi

      # Every static gate `make check` runs, without running the tests again.
      - name: Run Quality Gates
        run: make gates

      - name: Run Adversarial Matching Evaluation
        run: make match-eval-adversarial

      - name: Build Production Binaries
        run: go build -trimpath -o bin/ ./cmd/server ./cmd/worker ./cmd/cli ./cmd/etl ./cmd/dbcheck

  lighthouse:
    name: Mobile Lighthouse Performance Audit
    runs-on: ubuntu-latest
    needs: [check]
    # Advisory: a performance regression is reported, not merge-blocking.
    continue-on-error: true

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dawa24
          POSTGRES_PASSWORD: dawa24
          POSTGRES_DB: dawa24_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dawa24 -d dawa24_store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Build and migrate
        run: |
          go build -trimpath -o bin/ ./cmd/server ./cmd/cli
          ./bin/cli migrate

      - name: Start server
        env:
          PORT: "8080"
        run: |
          ./bin/server > server.log 2>&1 &
          curl --retry 30 --retry-connrefused --retry-delay 1 -sf http://localhost:8080/health \
            || { cat server.log; exit 1; }

      - name: Run Lighthouse CI Audit
        run: |
          lhci autorun --collect.url="http://localhost:8080/" \
                       --collect.url="http://localhost:8080/catalog" \
                       --collect.url="http://localhost:8080/cart"
